          [7, 2]: 10 # east
          [8, 1]: 10 # north
          # Left index
          [10, 2]: 10 # east
          [12, 2]: 10 # west
          [11, 1]: 10 # north
          # Right index
          [13, 2]: 10 # west
          [15, 2]: 10 # east
          [14, 1]: 10 # north
          # Right middle
          [16, 2]: 10 # west
          [18, 2]: 10 # east
          [17, 1]: 10 # north
          # Right ring
