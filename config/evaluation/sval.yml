# Shared finger factors
_default_finger_factors: &default_finger_factors
  Pinky: 1.5
  Ring: 1.2
  Middle: 1.0
  Index: 0.8

metrics:
  hand_disbalance:
    enabled: true
    weight: 25.0
    normalization:
      type: fixed
      value: 1.0
    params:
      null: null

  finger_balance:
    enabled: true
    weight: 50.0
    normalization:
      type: fixed
      value: 1.0
    params:
      intended_loads:
        [Left, Pinky]: 7.5
        [Left, Ring]: 11.5
        [Left, Middle]: 14
        [Left, Index]: 16
        [Right, Index]: 16
        [Right, Middle]: 14
        [Right, Ring]: 11.5
        [Right, Pinky]: 7.5
      finger_factors: *default_finger_factors

  # Each keystroke incurs a cost (defined in the keyboard's layout config)
  key_costs:
    enabled: true
    weight: 5.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      null: null

  modifier_usage:
    enabled: false
    weight: 100.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      hold_cost: 1.0
      one_shot_cost: 0.0
      long_press_cost: 1.0

  # =============================================================================
  # Bigram metrics
  # =============================================================================

  bigram_stats:
    enabled: true
    weight: 0.0
    normalization:
      type: fixed
      value: 1.0
    params:
      ignore_thumbs: true
      ignore_modifiers: true
      # Ignore specific SFB movements
      # Format: list of [from_direction, to_direction] pairs
      ignore_movements:
        - [Center, South]

  sfb:
    enabled: true
    weight: 150.0
    normalization:
      type: weight_found
      value: 1.0

    params:
      default_cost: 0
      ignore_thumbs: true
      ignore_modifiers: true
      finger_factors: *default_finger_factors

      # High-frequency roll penalty
      critical_bigram_fraction: 0.0005
      critical_bigram_factor: 100.0
      # Format:
      #   from:
      #     to: cost
      #     to: cost
      #     etc.
      costs:
        Center:
          North: 2.0
          South: 0.0
          In: 1.0
          Out: 3.0
        North:
          Center: 2.0
          South: 5.0
          In: 3.0
          Out: 4.0
        South:
          Center: 1.0
          North: 6.0
          In: 2.0
          Out: 3.0
        In:
          Center: 2.0
          North: 4.0
          South: 2.0
          Out: 5.0
        Out:
          Center: 3.0
          North: 5.0
          South: 3.0
          In: 5.0
        Pad:
          Up: 0.5
        Up:
          Pad: 3.0

  fsb:
    enabled: true
    weight: 1000.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      vertical:
        cost: 1.0
        finger_factors: *default_finger_factors
      squeeze:
        cost: 1.0
        finger_factors: *default_finger_factors
      splay:
        cost: 1.0
        finger_factors: *default_finger_factors
      # High-frequency scissor penalty
      critical_bigram_fraction: 0.0003
      critical_bigram_factor: 50.0

  hsb:
    enabled: true
    weight: 100.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      diagonal:
        cost: 1.0
        finger_factors: *default_finger_factors
      lateral:
        cost: 0.0
        finger_factors: *default_finger_factors

  sympathetic:
    enabled: true
    weight: 100.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      # Per-direction independence cost (research-based)
      # Lower = more independent. Formula: dir1_cost × dir2_cost × pair_factor
      # Multiplication means independent movements (low cost) reduce coupling
      # - Center (home): 0.0 = neutral, no penalty with any direction
      # - South (flexion): 0.2 = highest independence
      # - North (extension): 1.0 = more coupling than flexion
      # - In/Out (lateral): 1.0 = same coupling as extension
      direction_costs:
        Center: 0.0
        South: 0.2
        North: 1.0
        In: 1.0
        Out: 1.0

      # Finger-pair coupling multipliers (symmetric - order doesn't matter)
      # Research: Ring-Pinky 31-64%, Middle-Ring 37-52%, Index-Middle 21-28%
      # Factors derived from coupling ratios normalized to Ring-Pinky
      finger_pair_factors:
        [Ring, Pinky]: 1.5 # 31-64% coupling
        [Middle, Ring]: 1.4 # 37-52% coupling
        [Index, Middle]: 0.5 # 21-28% coupling

  # =============================================================================
  # Trigram metrics
  # =============================================================================

  trigram_stats:
    enabled: true
    weight: 0.0
    normalization:
      type: fixed
      value: 1.0
    params:
      ignore_thumbs: true
      ignore_modifiers: true
      # Track specific same-finger movements within bigram rolls (e.g., [[Center, South], [In, South]])
      # Format: list of [from_direction, to_direction] pairs
      same_finger_rolls:
        - [Center, South]

  weak_redirect:
    enabled: true
    weight: 100
    normalization:
      type: weight_found
      value: 1.0
    params:
      base_cost: 5.0
      ignore_thumbs: true
      ignore_modifiers: true

  sfs:
    enabled: true
    weight: 25.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      ignore_thumbs: true
      ignore_modifiers: true
      finger_factors:
        Pinky: 2.0
        Ring: 1.5
        Middle: 1.0
        Index: 1.0

  # =============================================================================
  # Positions
  # =============================================================================

  manual_bigram_penalty:
    enabled: true
    weight: 1000.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      add_mirrored: true
      # key positions as matrix positions (from config/keyboard/sval.yml) and the corresponding costs
      # [from_position, to_position]: weight
      matrix_positions:
        # Same-key repeats on pinky
        [[2, 1], [2, 1]]: 1 # left pinky north
        [[2, 2], [2, 2]]: 1 # left pinky center
        [[2, 3], [2, 3]]: 1 # left pinky south
        [[1, 2], [1, 2]]: 10 # left pinky west
        [[3, 2], [3, 2]]: 10 # left pinky east
        [[23, 1], [23, 1]]: 10 # right pinky north
        [[23, 2], [23, 2]]: 1 # right pinky center
        [[23, 3], [23, 3]]: 1 # right pinky south
        [[22, 2], [22, 2]]: 10 # right pinky west
        [[24, 2], [24, 2]]: 10 # right pinky east

  character_constraints:
    enabled: true
    weight: 1000.0
    normalization:
      type: weight_found
      value: 1
    params:
