# Shared finger factors
_default_finger_factors: &default_finger_factors
  Pinky: 1.5
  Ring: 1.2
  Middle: 1.0
  Index: 0.8

metrics:
  hand_disbalance:
    enabled: true
    weight: 25.0
    normalization:
      type: fixed
      value: 1.0
    params:
      null: null

  finger_balance:
    enabled: true
    weight: 50.0
    normalization:
      type: fixed
      value: 1.0
    params:
      intended_loads:
        [Left, Pinky]: 7.5
        [Left, Ring]: 11.5
        [Left, Middle]: 14
        [Left, Index]: 16
        [Right, Index]: 16
        [Right, Middle]: 14
        [Right, Ring]: 11.5
        [Right, Pinky]: 7.5
      finger_factors: *default_finger_factors

  # Each keystroke incurs a cost (defined in the keyboard's layout config)
  key_costs:
    enabled: true
    weight: 5.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      null: null

  modifier_usage:
    enabled: false
    weight: 100.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      hold_cost: 1.0
      one_shot_cost: 0.0
      long_press_cost: 1.0

  # =============================================================================
  # Bigram metrics
  # =============================================================================

  bigram_stats:
    enabled: true
    weight: 0.0
    normalization:
      type: fixed
      value: 1.0
    params:
      ignore_thumbs: true
      ignore_modifiers: true
      # Ignore specific SFB movements
      # Format: list of [from_direction, to_direction] pairs
      ignore_movements:
        - [Center, South]

  sfb:
    enabled: true
    weight: 150.0
    normalization:
      type: weight_found
      value: 1.0

    params:
      default_cost: 0
      ignore_thumbs: true
      ignore_modifiers: true
      finger_factors: *default_finger_factors

      # High-frequency roll penalty
      critical_bigram_fraction: 0.0005
      critical_bigram_factor: 100.0
      # Format:
      #   from:
      #     to: cost
      #     to: cost
      #     etc.
      costs:
        Center:
          North: 2.0
          South: 0.0
          In: 1.0
          Out: 3.0
        North:
          Center: 2.0
          South: 5.0
          In: 3.0
          Out: 4.0
        South:
          Center: 1.0
          North: 6.0
          In: 2.0
          Out: 3.0
        In:
          Center: 2.0
          North: 4.0
          South: 2.0
          Out: 5.0
        Out:
          Center: 3.0
          North: 5.0
          South: 3.0
          In: 5.0
        Pad:
          Up: 0.5
        Up:
          Pad: 3.0

  fsb:
    enabled: true
    weight: 1000.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      vertical:
        cost: 1.0
        finger_factors: *default_finger_factors
      squeeze:
        cost: 1.0
        finger_factors: *default_finger_factors
      splay:
        cost: 1.0
        finger_factors: *default_finger_factors
      # High-frequency scissor penalty
      critical_bigram_fraction: 0.0003
      critical_bigram_factor: 50.0

  hsb:
    enabled: true
    weight: 100.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      diagonal:
        cost: 1.0
        finger_factors: *default_finger_factors
      lateral:
        cost: 0.0
        finger_factors: *default_finger_factors

  sympathetic:
    enabled: true
    weight: 500.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      # Ordered finger-pair coupling multipliers
      # Key: [first_finger, second_finger] - ORDER MATTERS
      # The second finger is "enslaved" by the first; specify both directions
      # Upper-bound research values: coupling% / 24.5% (Index-Middle baseline)
      finger_pair_factors:
        # Middle-Ring pair (37-52% coupling)
        [Middle, Ring]: 2.5 # Ring enslaved (20-25% independence) - hardest
        [Ring, Middle]: 1.8 # Middle enslaved (~31% independence)

        # Ring-Pinky pair (31-64% coupling)
        [Ring, Pinky]: 3.0 # Pinky enslaved - very constrained
        [Pinky, Ring]: 2.2 # Ring enslaved

        # Index-Middle pair (21-28% coupling) - disabled
        [Index, Middle]: 0.0 # Middle enslaved
        [Middle, Index]: 0.0 # Index has high independence (61%)

  # =============================================================================
  # Trigram metrics
  # =============================================================================

  trigram_stats:
    enabled: true
    weight: 0.0
    normalization:
      type: fixed
      value: 1.0
    params:
      ignore_thumbs: true
      ignore_modifiers: true
      # Track specific same-finger movements within bigram rolls (e.g., [[Center, South], [In, South]])
      # Format: list of [from_direction, to_direction] pairs
      same_finger_rolls:
        - [Center, South]

  weak_redirect:
    enabled: true
    weight: 100
    normalization:
      type: weight_found
      value: 1.0
    params:
      base_cost: 5.0
      ignore_thumbs: true
      ignore_modifiers: true

  sfs:
    enabled: true
    weight: 25.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      ignore_thumbs: true
      ignore_modifiers: true
      finger_factors:
        Pinky: 2.0
        Ring: 1.5
        Middle: 1.0
        Index: 1.0

  # =============================================================================
  # Positions
  # =============================================================================

  manual_bigram_penalty:
    enabled: true
    weight: 1000.0
    normalization:
      type: weight_found
      value: 1.0
    params:
      add_mirrored: true
      # key positions as matrix positions (from config/keyboard/sval.yml) and the corresponding costs
      # [from_position, to_position]: weight
      matrix_positions:
        # Left pinky
        [[1, 2], [1, 2]]: 10 # west
        [[2, 1], [2, 1]]: 10 # north
        [[2, 2], [2, 2]]: 1 # center
        [[2, 3], [2, 3]]: 1 # south
        [[3, 2], [3, 2]]: 10 # east
        # Left ring
        [[4, 2], [4, 2]]: 10 # west
        [[6, 2], [6, 2]]: 10 # east
        # Right ring
        [[19, 2], [19, 2]]: 10 # west
        [[21, 2], [21, 2]]: 10 # east
        # Right pinky
        [[22, 2], [22, 2]]: 10 # west
        [[23, 1], [23, 1]]: 10 # north
        [[23, 2], [23, 2]]: 1 # center
        [[23, 3], [23, 3]]: 1 # south
        [[24, 2], [24, 2]]: 10 # east

  character_constraints:
    enabled: true
    weight: 1000.0
    normalization:
      type: weight_found
      value: 1
    params:
      costs:
        # Format: Key positions as matrix positions (from config/keyboard/sval.yml) and the corresponding costs
        # Syntax: [column, row]: cost_value

        # High-frequency double consonants (l,s,t,f,p,r)
        # Allowed on index/middle (all), ring center/south only (no laterals), pinky center only

        # Mid-frequency double consonants (m,c,n)
        # Allowed on index/middle (all), ring center/south (laterals tolerated), pinky center only

        # === High-frequency double consonants ===
        l:
          # Left pinky
          [3, 2]: 10 # west
          [1, 2]: 10 # east
          [2, 1]: 10 # north
          [2, 3]: 10 # south
          # Right pinky
          [22, 2]: 10 # west
          [24, 2]: 10 # east
          [23, 1]: 10 # north
          [23, 3]: 10 # south
          # Left ring
          [6, 2]: 10 # west
          [4, 2]: 10 # east
          [5, 1]: 10 # north
          # Right ring
          [19, 2]: 10 # west
          [21, 2]: 10 # east
          [20, 1]: 10 # north
        s:
          # Left pinky
          [3, 2]: 10 # west
          [1, 2]: 10 # east
          [2, 1]: 10 # north
          [2, 3]: 10 # south
          # Right pinky
          [22, 2]: 10 # west
